<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Nuevo Vuelo - NextStop Proveedor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] flex min-h-screen font-sans text-slate-800">

  <!-- SIDEBAR UNIFICADO PROVEEDOR -->
  <aside class="w-64 h-screen sticky top-0 bg-[#1E2530] text-gray-300 flex flex-col justify-between p-6 shrink-0 z-20">
    <div>
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-lg shadow">
          <i class="fa-solid fa-plane-departure"></i>
        </div>
        <div>
          <h2 class="text-white font-extrabold text-lg leading-tight tracking-tight">Next<span class="text-emerald-500">Stop</span></h2>
          <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">PORTAL PROVEEDOR</p>
        </div>
      </div>

      <nav class="space-y-2 text-sm font-semibold">
        <a href="/dashboard/proveedor" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.path == '/dashboard/proveedor' %}bg-[#2D3748] text-white shadow-sm{% else %}hover:bg-[#2D3748]/50 hover:text-white text-gray-400{% endif %}">
          <i class="fa-solid fa-table-cells-large {% if request.path == '/dashboard/proveedor' %}text-emerald-400{% endif %}"></i> Panel Principal
        </a>
        <a href="/proveedor/agregar-vuelo" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.path == '/proveedor/agregar-vuelo' %}bg-[#2D3748] text-white shadow-sm{% else %}hover:bg-[#2D3748]/50 hover:text-white text-gray-400{% endif %}">
          <i class="fa-solid fa-circle-plus {% if request.path == '/proveedor/agregar-vuelo' %}text-emerald-400{% endif %}"></i> Agregar Vuelo
        </a>
        <a href="/proveedor/mis-vuelos" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.path == '/proveedor/mis-vuelos' or '/proveedor/vuelos/editar' in request.path %}bg-[#2D3748] text-white shadow-sm{% else %}hover:bg-[#2D3748]/50 hover:text-white text-gray-400{% endif %}">
          <i class="fa-solid fa-calendar-check {% if request.path == '/proveedor/mis-vuelos' or '/proveedor/vuelos/editar' in request.path %}text-emerald-400{% endif %}"></i> Mis Vuelos
        </a>
        <a href="/proveedor/perfil" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.path == '/proveedor/perfil' %}bg-[#2D3748] text-white shadow-sm{% else %}hover:bg-[#2D3748]/50 hover:text-white text-gray-400{% endif %}">
          <i class="fa-solid fa-building {% if request.path == '/proveedor/perfil' %}text-emerald-400{% endif %}"></i> Perfil de Agencia
        </a>
      </nav>
    </div>

    <a href="/logout" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:text-red-300 hover:bg-[#2D3748]/30 rounded-xl transition text-sm font-semibold">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
    </a>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-10 overflow-y-auto flex flex-col items-center">
    <div class="w-full max-w-4xl flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Publicar Nuevo Vuelo</h1>
        <p class="text-xs text-gray-400 font-semibold mt-1">Selecciona la ruta e ingresa los detalles comerciales de tu oferta.</p>
      </div>
    </div>

    <!-- TARJETA DEL FORMULARIO -->
    <div class="bg-white rounded-3xl p-10 border border-gray-100 shadow-sm w-full max-w-4xl">
      <form method="POST" action="/proveedor/agregar-vuelo" class="space-y-6">

        <!-- DATALISTS PARA BÚSQUEDA INTELIGENTE -->
        <datalist id="lista-paises"></datalist>
        <datalist id="lista-ciudades-salida"></datalist>
        <datalist id="lista-ciudades-destino"></datalist>

        <!-- Origen -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">País de Salida</label>
            <input type="text" name="pais_salida" id="input-pais-salida" list="lista-paises" autocomplete="off" required placeholder="ej. Estados Unidos" class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Ciudad de Salida</label>
            <input type="text" name="ciudad_salida" id="input-ciudad-salida" list="lista-ciudades-salida" autocomplete="off" required placeholder="ej. Nueva York" class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>

        <!-- Destino -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">País de Destino</label>
            <input type="text" name="pais_destino" id="input-pais-destino" list="lista-paises" autocomplete="off" required placeholder="ej. Francia" class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Ciudad de Destino</label>
            <input type="text" name="ciudad_destino" id="input-ciudad-destino" list="lista-ciudades-destino" autocomplete="off" required placeholder="ej. París" class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>

        <!-- Fechas y Horarios -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Fecha y Hora de Salida</label>
            <input type="datetime-local" name="salida_datetime" required class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Fecha y Hora de Llegada</label>
            <input type="datetime-local" name="llegada_datetime" required class="w-full bg-[#F8FAFC] px-4 py-3 rounded-2xl border border-gray-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>

        <!-- Precio Base -->
        <div class="text-center pt-4">
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 mb-2">PRECIO BASE ($)</label>
          <div class="max-w-md mx-auto relative">
            <span class="absolute left-4 top-3 text-gray-400 font-bold">$</span>
            <input type="number" step="0.01" name="precio" required placeholder="3500" class="w-full bg-[#F8FAFC] pl-8 pr-4 py-3 rounded-2xl border border-gray-200 text-sm font-bold text-slate-800 text-center focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>

        <div class="pt-6">
          <button type="submit" class="w-full py-4 bg-[#547352] hover:bg-[#435e41] active:scale-95 text-white font-extrabold rounded-2xl uppercase text-xs tracking-wider shadow-lg transition">
            PUBLICAR VUELO OFICIAL
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // BÚSQUEDA INTELIGENTE DE PAÍSES Y CIUDADES
    const datosGeograficos = {
      "México": ["Ciudad de México", "Monterrey", "Guadalajara", "Cancún", "Tijuana", "Veracruz", "Ciudad del Carmen", "Mérida"],
      "Estados Unidos": ["Nueva York", "Los Ángeles", "Miami", "Chicago", "Houston", "Dallas", "Atlanta"],
      "Canadá": ["Toronto", "Vancouver", "Montreal", "Calgary"],
      "España": ["Madrid", "Barcelona", "Valencia", "Sevilla"],
      "Francia": ["París", "Marsella", "Lyon", "Niza"],
      "Colombia": ["Bogotá", "Medellín", "Cali", "Cartagena"],
      "Argentina": ["Buenos Aires", "Córdoba", "Mendoza", "Rosario"],
      "Perú": ["Lima", "Cusco", "Arequipa"]
    };

    // Llenar datalist de países
    const listaPaises = document.getElementById('lista-paises');
    Object.keys(datosGeograficos).forEach(pais => {
      let option = document.createElement('option');
      option.value = pais;
      listaPaises.appendChild(option);
    });

    // Función para llenar ciudades basadas en el país elegido
    function actualizarCiudades(inputPaisId, datalistCiudadesId) {
      const paisSeleccionado = document.getElementById(inputPaisId).value;
      const listaCiudades = document.getElementById(datalistCiudadesId);
      listaCiudades.innerHTML = ''; // Limpiar lista anterior

      if (datosGeograficos[paisSeleccionado]) {
        datosGeograficos[paisSeleccionado].forEach(ciudad => {
          let option = document.createElement('option');
          option.value = ciudad;
          listaCiudades.appendChild(option);
        });
      }
    }

    // Escuchar eventos en los inputs de países
    document.getElementById('input-pais-salida').addEventListener('input', () => actualizarCiudades('input-pais-salida', 'lista-ciudades-salida'));
    document.getElementById('input-pais-destino').addEventListener('input', () => actualizarCiudades('input-pais-destino', 'lista-ciudades-destino'));
  </script>
</body>
</html>
